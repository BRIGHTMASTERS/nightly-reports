services:
  - type: cron
    name: nightly-report
    runtime: python
    plan: starter
    region: frankfurt
    schedule: '0 2 * * *'
    buildCommand: pip install -r requirements.txt
    startCommand: python nightly_report.py
    envVars:
      - key: REPORT_API_URL
        value: https://46.225.121.168:8443/api/v1/report/snapshot
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        value: "-1003878517539"
      - key: TELEGRAM_TOPIC_ID
        value: "1553"
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: BRIGHTMASTERS/nightly-reports
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_REPORTS_PATH
        value: reports
